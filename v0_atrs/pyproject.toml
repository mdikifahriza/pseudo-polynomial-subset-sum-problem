[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atrs-atsp-research"
version = "1.0.0"
description = "Adaptive Exact Solvers for Subset Sum (ATRS) and Traveling Salesperson Problem (ATSP)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Research Team" }
]
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
]

[project.scripts]
atrs = "atrs:main"
atsp = "atsp:main"
